<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>

   <script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/4.0.0/jquery.min.js"></script>

</head>

 <style>
       #logo
{
    width:100px;
    height:30px;
    background:purple;
    box-shadow:10px 10px 10px gray;
    color:white;
    position:absolute;
    left:-500px;
    top:0px;
    text-align:center;
    padding:20px;
    font-family:arial black;
}
    </style>

<body>
 
<div id="logo">TEXT HERE</div>    


<script>

var box = document.getElementById("logo")
$(document).ready(function()
{
    $("#logo").animate({left:"200px"},1000).delay(1000).animate({top:"100px",borderRadius:"100px"},1000,changecolor)

    $("#logo").animate({fontSize:"+=10",width:"+=100",height:"+=10px"},1000,blink)
})

function changecolor()
{
    box.style.background="black"
    box.style.color="cyan"
}

var r,g,b,c
function blink()
{
    r = Math.round(Math.random()*255)
    b = Math.round(Math.random()*255)
    g = Math.round(Math.random()*255)
    c = `rgb(${r},${g},${b})`
    box.style.color = c
    setTimeout("blink()",1000)
}

</script>


</body>
</html>
