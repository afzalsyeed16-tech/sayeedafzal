<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
<input type="color" style="position: absolute;" id="colorpicker">    
<canvas id="mycan" style="background: rgb(231, 231, 231);" width="600" height="600"></canvas>

<script>

var c=document.getElementById("mycan");
var colorpicker=document.getElementById("colorpicker");
var k;
var r=10
var d= c.getContext("2d");
c.width=window.innerWidth;
c.height=window.innerHeight;
var red, green, blue, drawcolor
var drawmode=false
drawcolor = "black"

colorpicker.onchange=function()
{
 drawcolor=this.value   
}

function f1(event)
{
k=event.key
switch(k)
{
case "r":
    if(r<200)
{
    r=r+1
    document.title=r
}
 break;

case "t":
if(r>10)
{
r=r-1
document.title=r
}
break;

case " ":
    d.clearRect(0,0,window.innerWidth,window.innerHeight)
    break;
}

}


function draw(event)
{

if(drawmode){

var x=event.pageX
var y= event.pageY
red=Math.round(Math.random()*255)
green=Math.round(Math.random()*255)
blue=Math.round(Math.random()*255)
drawcolor="rgb("+red+","+green+","+blue+")"

d.beginPath();

//d.arc(x, y, r, 0, 2 * Math.PI);
//d.rect(x,y,r,r);
d.moveTo(x,y)
d.lineTo(Math.random()*1200,Math.random()*1200);
d.fillStyle=drawcolor
d.fill()
d.stroke();
d.lineWidth=Math.random()*1
d.strokeStyle=drawcolor

}

}

function f2()
{
drawmode=(!drawmode)?true:false
document.title=drawmode
}


document.addEventListener("keydown",f1)
document.addEventListener("mousemove",draw)
document.addEventListener("click",f2)
</script>


</body>
</html>
